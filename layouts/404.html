{{- define "main" }}
<section class="error-404" aria-labelledby="error-404-title">
    <h1 class="error-404__title" id="error-404-title">404 页面未找到</h1>
    <div class="error-404__visual" data-error-404-visual>
        <img
            class="error-404__poster"
            src="{{ "animations/v1/page-not-found-404.png" | relURL }}"
            width="640"
            height="640"
            alt=""
        >
        <span
            class="error-404__animation"
            data-error-404-animation
            data-src="{{ "animations/v1/page-not-found-404.lottie" | relURL }}"
            aria-hidden="true"
        ></span>
    </div>
</section>

<script>
    (() => {
        const visual = document.querySelector('[data-error-404-visual]');
        if (!visual || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        visual.classList.add('is-loading');
        window.setTimeout(() => {
            if (!visual.classList.contains('is-ready')) visual.classList.remove('is-loading');
        }, 10000);
    })();
</script>

<script type="module">
    const visual = document.querySelector('[data-error-404-visual]');
    const mount = visual?.querySelector('[data-error-404-animation]');
    const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // Loop only while the complete composition is visible.
    const visibleSegment = [78, 136];
    let player;
    let animation;
    let isLoading = false;

    const showPoster = () => {
        isLoading = false;
        visual?.classList.remove('is-loading', 'is-ready');
        player?.remove();
        player = undefined;
        animation = undefined;
    };

    const showAnimation = () => {
        if (reduceMotionQuery.matches) {
            showPoster();
            return;
        }

        isLoading = false;
        visual.classList.remove('is-loading');
        visual.classList.add('is-ready');
        animation.play();
    };

    const loadAnimation = async () => {
        if (!visual || !mount?.dataset.src || reduceMotionQuery.matches || isLoading || player) return;
        isLoading = true;
        visual.classList.add('is-loading');

        try {
            const { loadDotLottie } = await import('{{ "js/lottie-runtime.js" | relURL }}');
            await loadDotLottie();
            if (reduceMotionQuery.matches) {
                showPoster();
                return;
            }

            player = document.createElement('dotlottie-wc');
            player.className = 'error-404__player';
            player.toggleAttribute('loop', true);
            player.setAttribute('segment', JSON.stringify(visibleSegment));
            player.setAttribute('mode', 'bounce');
            player.setAttribute('src', mount.dataset.src);
            mount.append(player);
            animation = player.dotLottie;

            if (!animation) {
                showPoster();
                return;
            }

            animation.addEventListener('loadError', showPoster, { once: true });
            if (animation.isLoaded) {
                showAnimation();
            } else {
                animation.addEventListener('load', showAnimation, { once: true });
            }
        } catch {
            showPoster();
        }
    };

    if (visual && mount) {
        reduceMotionQuery.addEventListener('change', (event) => {
            if (event.matches) {
                animation?.pause();
                showPoster();
            } else {
                loadAnimation();
            }
        });

        loadAnimation();
    }
</script>
{{- end }}
