{{- /* Mermaid 使用官方内置主题，并在 PaperMod 明暗模式切换时重绘 */ -}}
{{ if .Params.mermaid }}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.esm.min.mjs';

    const root = document.documentElement;
    const getMermaidTheme = () => root.getAttribute("data-theme") === "dark" ? "dark" : "default";
    const getMermaidConfig = () => ({
        startOnLoad: false,
        securityLevel: "loose",
        theme: getMermaidTheme()
    });

    // 1. 初始化配置
    mermaid.initialize(getMermaidConfig());

    // 2. 备份原始代码并执行初次渲染
    const initAndRender = async () => {
        const elements = document.querySelectorAll('.mermaid');
        elements.forEach(el => {
            // 将原始的 mermaid 文本代码存入 dataset，防止重绘时读取到 SVG 标签
            if (!el.dataset.originalCode) {
                el.dataset.originalCode = el.textContent.trim();
            }
        });
        await renderMermaid();
    };

    // 3. 渲染/重绘函数
    const renderMermaid = async () => {
        const elements = document.querySelectorAll('.mermaid');
        for (const el of elements) {
            // 还原原始代码，清除已渲染的 SVG
            el.textContent = el.dataset.originalCode;
            el.removeAttribute('data-processed');
        }
        // 执行渲染
        await mermaid.run({ nodes: elements });
    };

    // 启动
    if (document.readyState === "loading") {
        document.addEventListener('DOMContentLoaded', initAndRender, { once: true });
    } else {
        initAndRender();
    }

    // 4. 监听 PaperMod 主题切换
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                mermaid.initialize(getMermaidConfig());
                renderMermaid();
            }
        });
    });

    observer.observe(root, { attributes: true, attributeFilter: ['data-theme'] });
</script>
{{ end }}
