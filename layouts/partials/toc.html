{{- if and .Params.ShowToc (ne .TableOfContents "<nav id=\"TableOfContents\"></nav>") }}
  {{- $toc := .TableOfContents -}}
  {{- $toc = replace $toc "<a href=\"" "<a class=\"paper-floating-toc-link\" href=\"" -}}

  <aside class="paper-floating-toc" aria-label="文章目录">
    <div class="paper-floating-toc-panel">
      {{- $toc | safeHTML -}}
    </div>
  </aside>
{{- end }}
