<script src="/js/medium-zoom.min.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof mediumZoom === 'function') {
      mediumZoom('.post-content img:not(.no-zoom)', {
        margin: 70,
        background: 'rgba(0,0,0,0.8)',
        scrollOffset: 40,
      });
    }
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.matchMedia('(max-width: 640px)').matches) return;

    const items = document.querySelectorAll('.follow-profile');

    items.forEach((item) => {
      const trigger = item.querySelector('.follow-profile-trigger');
      if (!trigger) return;

      trigger.addEventListener('click', function (event) {
        event.preventDefault();
        const isOpen = item.classList.contains('is-open');

        items.forEach((other) => {
          other.classList.remove('is-open');
          const otherTrigger = other.querySelector('.follow-profile-trigger');
          if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
        });

        if (!isOpen) {
          item.classList.add('is-open');
          trigger.setAttribute('aria-expanded', 'true');
        }
      });
    });

    document.addEventListener('click', function (event) {
      items.forEach((item) => {
        if (item.contains(event.target)) return;
        item.classList.remove('is-open');
        const trigger = item.querySelector('.follow-profile-trigger');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
      });
    });
  });
</script>
